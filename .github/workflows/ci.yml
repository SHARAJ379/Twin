name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only: nothing here writes to the repository. Without this the jobs
# got whatever the repository's default token permissions are.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Python/Go/Ruby/PHP fixture apps that the live-validation e2e tests
      # boot as real child processes (examples/*-python, *-go, *-ruby, *-php).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # For the Flask fixture app (tests/e2e/flaskSecretKey.test.ts).
      - run: python -m pip install flask
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.22"
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
      - run: npm ci
      # Standalone fixture apps (own package.json/lock, no npm workspace) that
      # several e2e tests boot as real child processes - without this they
      # have no node_modules on a clean checkout and every one of those tests fails.
      - run: npm ci --prefix examples/broken-express
      - run: npm ci --prefix examples/fixed-express
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run depcheck
      # Not covered by `npm run build`, which compiles src/ only - and until
      # recently not covered by anything, since tests/ fell outside every
      # tsconfig's include.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The GitHub Action as a user runs it: their own Node already set up, no
  # dependencies installed. It used to force Node 20 onto the job and never
  # install the project's dependencies, so the README snippet ended in
  # E_BOOT_CRASH for any Node app.
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: fixed
        uses: ./
        with:
          project-dir: examples/fixed-express
      - id: broken
        uses: ./
        with:
          project-dir: examples/broken-express
          fail-on-finding: "false"
      - name: Check the Action passed fixed, failed broken, and left the job's Node alone
        shell: bash
        env:
          FIXED: ${{ steps.fixed.outputs.exit-code }}
          BROKEN: ${{ steps.broken.outputs.exit-code }}
        run: |
          set -u
          node --version | grep -q '^v22\.' || { echo "the Action changed Node to $(node --version)"; exit 1; }
          [ "$FIXED" = "0" ] || { echo "fixed-express exited $FIXED, wanted 0"; exit 1; }
          [ "$BROKEN" = "1" ] || { echo "broken-express exited $BROKEN, wanted 1"; exit 1; }

  # A green suite says nothing about publishability: it runs against the
  # working tree, with devDependencies present. This packs the tarball,
  # installs it into a clean project, and drives the installed binary - the
  # shape of check that caught the stale-dist and broken-prepublish bugs by
  # hand before. Both shims matter, so both OSes run it.
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run pack:smoke
