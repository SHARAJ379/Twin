name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Go/Ruby/PHP fixture apps that the live-validation e2e tests boot
      # as real child processes (examples/*-go, examples/*-ruby, examples/*-php).
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: npm ci
      # Standalone fixture apps (own package.json/lock, no npm workspace) that
      # several e2e tests boot as real child processes - without this they
      # have no node_modules on a clean checkout and every one of those tests fails.
      - run: npm ci --prefix examples/broken-express
      - run: npm ci --prefix examples/fixed-express
      - run: npm run lint
      - run: npm run depcheck
      - run: npm run build
      - run: npm test
