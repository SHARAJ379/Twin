name: Install

# Runs the README's install commands exactly as written, on clean runners, then
# `--version` and `doctor` - so the moment the README's install line stops
# working, this goes red. It once said `npm install -g github:SHARAJ379/Twin`,
# which fails on every OS, and nothing ran it: the pack smoke test installs a
# tarball, and the Action job builds from a checkout.
#
# The commands come out of README.md itself (scripts/readmeInstall.mjs), so
# this can't drift from what users copy. They fetch Twin themselves: the npm
# and npx lines get the latest release from the registry, the source and
# unreleased ones whatever master is on GitHub - what someone following the
# README gets right now. On a pull request that's master, not the PR; the
# push that merges it runs this again. The weekly run catches what changes
# without a push of ours: npm 12, for one, started refusing git packages
# unless --allow-git is given.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: README install (${{ matrix.os }}, Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The npm each supported Node ships with, plus the newest npm, which
        # is the strictest about git packages and install scripts.
        variant: [bundled-20, bundled-24, npm-12]
        include:
          - variant: bundled-20
            node: 20
            npm: 10
          - variant: bundled-24
            node: 24
            npm: 11
          - variant: npm-12
            node: 22 # npm 12 needs Node >= 22.22.2
            npm: 12
            upgrade-npm: true
    runs-on: ${{ matrix.os }}
    steps:
      # Only for README.md and the script that reads it. Nothing is installed
      # from this checkout: the README's commands fetch Twin themselves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Upgrade npm
        if: matrix.upgrade-npm
        shell: bash
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        run: npm install -g "npm@$NPM_MAJOR"

      # The Node installer puts npm's global bin directory on PATH; a runner's
      # Node doesn't promise to, and `twin` lands there.
      - name: Put npm's global bin directory on PATH
        shell: bash
        run: |
          prefix="$(npm config get prefix)"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$prefix" >> "$GITHUB_PATH"; else echo "$prefix/bin" >> "$GITHUB_PATH"; fi

      - name: Check the npm under test is the one intended
        shell: bash
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        run: |
          echo "node $(node --version), npm $(npm --version)"
          [ "$(npm --version | cut -d. -f1)" = "$NPM_MAJOR" ] || { echo "expected npm $NPM_MAJOR"; exit 1; }

      # Every block README.md marks for each shell (scripts/readmeInstall.mjs
      # --list), not a list kept here: marking a block is all it takes to put
      # it under test, and a README with nothing marked fails instead of
      # running nothing.
      - name: Write the README's install commands out as scripts
        shell: bash
        run: |
          set -euo pipefail
          for shell in posix powershell; do
            node scripts/readmeInstall.mjs --list "$shell" > "$RUNNER_TEMP/routes-$shell.txt"
            ext=sh; [ "$shell" = powershell ] && ext=ps1
            mapfile -t routes < "$RUNNER_TEMP/routes-$shell.txt"
            for route in "${routes[@]}"; do
              node scripts/readmeInstall.mjs "$route" "$shell" > "$RUNNER_TEMP/$route-$shell.$ext"
            done
            echo "$shell routes: ${routes[*]}"
          done

      - name: Run every README install route (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t routes < "$RUNNER_TEMP/routes-posix.txt"
          for route in "${routes[@]}"; do
            echo "::group::README route: $route"
            # Each route starts with no Twin installed: npx runs a package
            # that's installed globally instead of fetching it, so after the
            # npm route the npx one would pass on that route's install.
            npm uninstall -g @sharaj379/twin
            if command -v twin; then echo "::error::twin is still installed before route $route"; exit 1; fi
            mkdir "$RUNNER_TEMP/run-$route"
            # stdin from /dev/null: npm and npx must not read (and use up) anything of ours.
            (cd "$RUNNER_TEMP/run-$route" && bash "$RUNNER_TEMP/$route-posix.sh" < /dev/null)
            echo "::endgroup::"
          done
          echo "ran: ${routes[*]}"

      # Windows PowerShell 5.1, the one every Windows machine has - not pwsh.
      - name: Run every README install route (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $routes = @(Get-Content "$env:RUNNER_TEMP\routes-powershell.txt" | Where-Object { $_.Trim() -ne '' })
          foreach ($route in $routes) {
            Write-Host "::group::README route: $route"
            # Each route starts with no Twin installed (see the bash step).
            npm uninstall -g @sharaj379/twin
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::npm uninstall -g failed before route '$route'"; exit 1 }
            if (Get-Command twin -ErrorAction SilentlyContinue) { Write-Host "::error::twin is still installed before route '$route'"; exit 1 }
            $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "run-$route")
            Push-Location $dir
            powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\$route-powershell.ps1"
            $code = $LASTEXITCODE
            Pop-Location
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Host "::error::README install route '$route' failed (exit $code)"; exit 1 }
          }
          Write-Host "ran: $($routes -join ' ')"
