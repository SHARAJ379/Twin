version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint 8.x caps its typescript peer at <6.1.0, so a major
      # typescript bump lands in the dev-dependencies group as an unresolvable
      # install (ERESOLVE) that fails every job before a single test runs.
      # Drop this once typescript-eslint supports the next typescript major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/examples/broken-express"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/examples/fixed-express"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
